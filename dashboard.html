<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nivesh Council</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:rgba(15,23,42,.08);
    --border-strong:rgba(15,23,42,.14);
    --text:#0f172a;
    --text-dim:#64748b;
    --text-faint:#94a3b8;
    --accent:#4f46e5;
    --accent-soft:#eef2ff;
    --green:#16a34a;
    --green-soft:#ecfdf3;
    --amber:#d97706;
    --amber-soft:#fffbeb;
    --red:#dc2626;
    --red-soft:#fef2f2;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:16px;margin-bottom:28px;
  }
  .brand-block h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .brand-block .sub{color:var(--text-dim);font-size:14px}
  .controls{display:flex;align-items:center;gap:10px}
  select{
    appearance:none;background:var(--card);border:1px solid var(--border-strong);
    border-radius:10px;padding:10px 34px 10px 14px;font-size:14px;color:var(--text);
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2364748b'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
  }
  #startBtn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px -4px rgba(79,70,229,.55);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  #startBtn:hover:not(:disabled){transform:translateY(-1px)}
  #startBtn:disabled{opacity:.6;cursor:default;box-shadow:none}
  #notice{
    margin:-10px 0 20px;padding:10px 14px;border-radius:10px;
    background:var(--amber-soft);color:#92400e;font-size:13px;border:1px solid rgba(217,119,6,.25);
    display:none;
  }

  /* ---------- KPI row ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .kpi-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow);
  }
  .kpi-card .label{font-size:12.5px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .kpi-card .value{font-size:28px;font-weight:700;letter-spacing:-.02em}
  .kpi-card .value.small{font-size:20px}
  .kpi-card .value .conf{font-size:14px;color:var(--text-dim);font-weight:600;margin-left:6px}

  /* ---------- section titles ---------- */
  .section-title{font-size:14px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px}

  /* ---------- agent grid ---------- */
  .agent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
  .agent-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    transition:border-color .2s ease;
  }
  .agent-card.working{border-color:rgba(79,70,229,.35)}
  .agent-card.done{border-color:rgba(22,163,74,.3)}
  .agent-top{display:flex;align-items:flex-start;gap:12px}
  .agent-icon{
    width:38px;height:38px;border-radius:10px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
  }
  .agent-name{font-size:15px;font-weight:700}
  .agent-role{font-size:12.5px;color:var(--text-dim);line-height:1.35;margin-top:2px}
  .agent-status{
    display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    padding:4px 0 0;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none}
  .status-offline .dot{background:var(--text-faint)}
  .status-offline .status-label{color:var(--text-faint)}
  .status-working .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .status-working .status-label{color:var(--accent)}
  .status-done .dot{background:var(--green)}
  .status-done .status-label{color:var(--green)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.45)}
    50%{box-shadow:0 0 0 5px rgba(79,70,229,0)}
  }
  .bars{display:flex;align-items:flex-end;gap:2px;height:12px;margin-left:2px}
  .bars span{width:3px;background:var(--accent);border-radius:1px;animation:bar 0.9s ease-in-out infinite}
  .bars span:nth-child(1){animation-delay:0s}
  .bars span:nth-child(2){animation-delay:.15s}
  .bars span:nth-child(3){animation-delay:.3s}
  @keyframes bar{
    0%,100%{height:3px}
    50%{height:12px}
  }
  .agent-stats{display:flex;gap:10px;margin-top:2px}
  .stat-box{flex:1;background:#f8f9fb;border:1px solid var(--border);border-radius:9px;padding:8px 10px}
  .stat-box .stat-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .stat-box .stat-value{font-size:16px;font-weight:700;margin-top:2px}

  /* ---------- verdict feed ---------- */
  .feed{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .feed-row{
    display:grid;grid-template-columns:100px 90px 1fr 130px;gap:16px;align-items:center;
    padding:14px 20px;border-bottom:1px solid var(--border);
  }
  .feed-row:last-child{border-bottom:none}
  .feed-row.head{background:#fafbfc;font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 20px}
  .feed-empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:14px}
  .stock-cell .sym{font-weight:700;font-size:14.5px}
  .stock-cell .name{font-size:12px;color:var(--text-dim);margin-top:1px}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
    font-size:12px;font-weight:700;letter-spacing:.02em;
  }
  .badge.BUY{background:var(--green-soft);color:var(--green)}
  .badge.WATCH{background:var(--amber-soft);color:var(--amber)}
  .badge.AVOID{background:var(--red-soft);color:var(--red)}
  .conf-cell{font-size:13px;color:var(--text-dim)}
  .conf-cell b{color:var(--text)}
  .why-cell{font-size:13px;color:var(--text-dim);line-height:1.4}
  .levels-cell{font-size:11.5px;color:var(--text-faint);margin-top:5px;line-height:1.4}
  .levels-cell .alt{display:block;color:var(--accent);margin-top:2px}
  .price-cell{text-align:right;font-size:13.5px}
  .price-cell .chg{font-weight:700}
  .price-cell .chg.up{color:var(--green)}
  .price-cell .chg.down{color:var(--red)}

  footer{margin-top:32px;text-align:center;color:var(--text-faint);font-size:12.5px}

  @media (max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .agent-grid{grid-template-columns:repeat(2,1fr)}
    .feed-row{grid-template-columns:1fr;gap:6px}
    .feed-row.head{display:none}
    .price-cell{text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-block">
      <h1 id="brandTitle">Loading…</h1>
      <div class="sub" id="brandSub">Indian stock analysis</div>
    </div>
    <div class="controls">
      <select id="modeSelect">
        <option value="demo">Demo (offline)</option>
        <option value="live">Live (yfinance)</option>
        <option value="auto">Auto (today's top sector)</option>
      </select>
      <select id="universeSelect" style="display:none"></select>
      <button id="startBtn">Start agents</button>
    </div>
  </header>

  <div id="notice"></div>

  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card"><div class="label">Universe</div><div class="value" id="kpiUniverse">0</div></div>
    <div class="kpi-card"><div class="label">In debate</div><div class="value" id="kpiDebate">0</div></div>
    <div class="kpi-card"><div class="label">Buy signals</div><div class="value" id="kpiBuy">0</div></div>
    <div class="kpi-card"><div class="label">Top pick</div><div class="value small" id="kpiTop">—</div></div>
  </div>

  <div class="section-title">Agents</div>
  <div class="agent-grid" id="agentGrid"></div>

  <div class="section-title">Latest verdicts</div>
  <div class="feed">
    <div class="feed-row head">
      <div>Verdict</div><div>Confidence</div><div>Why</div><div style="text-align:right">Price / Change</div>
    </div>
    <div id="feedBody"></div>
  </div>

  <footer id="footerText">Built from 0 real stocks · data pulled — · engine: —</footer>
</div>

<script>
let CFG = null;
let running = false;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function renderAgentShell(agents){
  const grid = document.getElementById('agentGrid');
  grid.innerHTML = '';
  agents.forEach(a => {
    const card = el('div', 'agent-card offline');
    card.id = 'agent-' + a.id;
    card.innerHTML = `
      <div class="agent-top">
        <div class="agent-icon">${a.icon}</div>
        <div>
          <div class="agent-name">${a.name}</div>
          <div class="agent-role">${a.role}</div>
        </div>
      </div>
      <div class="agent-status status-offline" id="status-${a.id}">
        <span class="dot"></span>
        <span class="status-label">offline</span>
      </div>
      <div class="agent-stats">
        <div class="stat-box">
          <div class="stat-label">${a.stat1_label}</div>
          <div class="stat-value" id="stat1-${a.id}">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">${a.stat2_label}</div>
          <div class="stat-value" id="stat2-${a.id}">0</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateAgent(id, data){
  const card = document.getElementById('agent-' + id);
  const statusEl = document.getElementById('status-' + id);
  if (!card || !statusEl) return;
  card.classList.remove('offline','working','done');
  card.classList.add(data.status);
  statusEl.className = 'agent-status status-' + data.status;
  let barsHtml = '';
  if (data.status === 'working') {
    barsHtml = '<span class="bars"><span></span><span></span><span></span></span>';
  }
  statusEl.innerHTML = `<span class="dot"></span><span class="status-label">${data.status}</span>${barsHtml}`;
  document.getElementById('stat1-' + id).textContent = data.stat1;
  document.getElementById('stat2-' + id).textContent = data.stat2;
}

function fmtNum(n){
  if (n === null || n === undefined) return '—';
  return n;
}

function fmtMoney(n){
  return (n === null || n === undefined) ? '—' : '₹' + Number(n).toFixed(2);
}

function buyLevelsHtml(v){
  // Entry/SL/TP only make sense for a BUY verdict — a trade is implied.
  // WATCH/AVOID never show these since no trade is implied.
  if (v.verdict !== 'BUY' || v.entry === null || v.entry === undefined) return '';
  const slPct = (v.sl_pct !== null && v.sl_pct !== undefined) ? Number(v.sl_pct).toFixed(2) : null;
  const rrPct = (v.risk_reward_pct !== null && v.risk_reward_pct !== undefined) ? Number(v.risk_reward_pct).toFixed(2) : null;
  const rrRatio = (v.rr_ratio !== null && v.rr_ratio !== undefined) ? Number(v.rr_ratio) : null;
  let line = `Entry ${fmtMoney(v.entry)} · SL ${fmtMoney(v.stop_loss)}`;
  if (slPct !== null) line += ` (-${slPct}%)`;
  line += ` · TP ${fmtMoney(v.take_profit)}`;
  if (rrPct !== null) line += ` (+${rrPct}%)`;
  if (rrRatio !== null) line += ` [RR 1:${rrRatio}]`;
  let html = `<div class="levels-cell">${line}`;
  if (v.analyst_target_note) html += `<span class="alt">${v.analyst_target_note}</span>`;
  html += `</div>`;
  return html;
}

function renderFeed(verdicts){
  const body = document.getElementById('feedBody');
  if (!verdicts || verdicts.length === 0){
    body.innerHTML = '<div class="feed-empty">No verdicts yet — click Start agents to begin analysis.</div>';
    return;
  }
  body.innerHTML = '';
  verdicts.forEach(v => {
    const row = el('div', 'feed-row');
    const chgClass = (v.day_change_pct || 0) >= 0 ? 'up' : 'down';
    const chgSign = (v.day_change_pct || 0) >= 0 ? '+' : '';
    const price = v.price !== null && v.price !== undefined ? '₹' + Number(v.price).toFixed(2) : '—';
    const chg = v.day_change_pct !== null && v.day_change_pct !== undefined ? chgSign + Number(v.day_change_pct).toFixed(2) + '%' : '—';
    row.innerHTML = `
      <div class="stock-cell">
        <div class="sym">${v.symbol.replace('.NS','')} <span class="badge ${v.verdict}">${v.verdict}</span></div>
        <div class="name">${v.name || ''}</div>
      </div>
      <div class="conf-cell"><b>${v.confidence}</b>/10</div>
      <div class="why-cell">${v.why || v.rationale || ''}${buyLevelsHtml(v)}</div>
      <div class="price-cell">${price}<br><span class="chg ${chgClass}">${chg}</span></div>
    `;
    body.appendChild(row);
  });
}

function renderUniverseOptions(sets){
  const sel = document.getElementById('universeSelect');
  sel.innerHTML = '';
  (sets || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.label;
    sel.appendChild(opt);
  });
}

function syncUniverseVisibility(){
  const mode = document.getElementById('modeSelect').value;
  document.getElementById('universeSelect').style.display = mode === 'live' ? '' : 'none';
}

async function loadConfig(){
  const res = await fetch('/config');
  CFG = await res.json();
  document.title = CFG.brand;
  document.getElementById('brandTitle').textContent = CFG.brand;
  document.getElementById('brandSub').textContent = `Indian stock analysis · ${CFG.agents.length} agents on duty`;
  renderAgentShell(CFG.agents);
  renderUniverseOptions(CFG.universe_sets);
  syncUniverseVisibility();
}

document.getElementById('modeSelect').addEventListener('change', syncUniverseVisibility);

function renderStatus(s){
  running = s.running;
  document.getElementById('startBtn').disabled = running;
  document.getElementById('startBtn').textContent = running ? 'Agents working…' : 'Start agents';
  document.getElementById('modeSelect').disabled = running;
  document.getElementById('universeSelect').disabled = running;

  document.getElementById('kpiUniverse').textContent = s.kpi.universe;
  document.getElementById('kpiDebate').textContent = s.kpi.in_debate;
  document.getElementById('kpiBuy').textContent = s.kpi.buy_signals;
  const top = s.kpi.top_pick;
  document.getElementById('kpiTop').innerHTML = top
    ? `${top.symbol.replace('.NS','')}<span class="conf">${top.confidence}/10</span>`
    : '—';

  Object.keys(s.agents).forEach(id => updateAgent(id, s.agents[id]));
  renderFeed(s.verdicts);

  const notice = document.getElementById('notice');
  if (s.notice){
    notice.style.display = 'block';
    notice.textContent = s.notice;
  } else {
    notice.style.display = 'none';
  }

  const f = s.footer || {};
  let footerText = `Built from ${f.stocks_count || 0} real stocks · data pulled ${f.data_timestamp || '—'} · engine: ${f.engine || '—'}`;
  if (f.universe_set){
    const found = (CFG.universe_sets || []).find(u => u.id === f.universe_set);
    footerText += ` · set: ${found ? found.label : f.universe_set}`;
  }
  if (f.auto_pick){
    const pct = f.auto_pick.percent_change;
    const pctStr = (pct !== null && pct !== undefined) ? `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%` : '';
    footerText += ` · auto-picked: today's biggest mover (${pctStr})`;
  }
  document.getElementById('footerText').textContent = footerText;
}

async function poll(){
  try {
    const res = await fetch('/status');
    const s = await res.json();
    renderStatus(s);
  } catch (e) { /* server may be mid-restart; ignore and retry */ }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const mode = document.getElementById('modeSelect').value;
  const universe_set = document.getElementById('universeSelect').value;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'Starting…';
  try {
    const res = await fetch('/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mode, universe_set}),
    });
    if (!res.ok){
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Could not start run');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'Start agents';
    }
  } catch (e) {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = 'Start agents';
  }
});

(async function init(){
  await loadConfig();
  await poll();
  setInterval(poll, 500);
})();
</script>
</body>
</html>
